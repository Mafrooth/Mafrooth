{id:"welcome",t:"Welcome message",aim:"A servlet that answers a GET request with a welcome page.",
files:[["NewServlet.java",`import java.io.*;
import javax.servlet.*;
import javax.servlet.annotation.WebServlet;
import javax.servlet.http.*;

@WebServlet(urlPatterns = {"/NewServlet"})
public class NewServlet extends HttpServlet {
  protected void processRequest(HttpServletRequest request,
      HttpServletResponse response) throws ServletException, IOException {
    response.setContentType("text/html;charset=UTF-8");
    try (PrintWriter out = response.getWriter()) {
      out.println("<!DOCTYPE html>");
      out.println("<html><head>");
      out.println("<title>Servlet NewServlet</title>");
      out.println("</head><body>");
      out.println("<h1>Servlet NewServlet at " + request.getContextPath()
          + " welcome to this page</h1>");
      out.println("</body></html>");
    }
  }
  @Override
  protected void doGet(HttpServletRequest request,
      HttpServletResponse response) throws ServletException, IOException {
    processRequest(request, response);
  }
}`]],out:"URL: http://localhost:8080/WebApplication1/NewServlet\n\nServlet NewServlet at /WebApplication1 welcome"},
{id:"exceptions",t:"Exception handling",aim:"A menu-driven program that triggers five common exceptions and catches each one.",
note:"The switch cases have no break statements, so each option also runs the cases below it. Add break after each case to run only the chosen one.",
files:[["ex.java",`import java.io.*;

class ex {
  public static void main(String args[]) throws IOException {
    BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
    int op;
    do {
      System.out.println("Enter your option\\n");
      System.out.println("1.Arithmetic Exception");
      System.out.println("2.StringIndexOutOfBound Exception");
      System.out.println("3.FileNotFound Exception");
      System.out.println("4.NumberFormat Exception");
      System.out.println("5.ArrayIndexOutOfBounds Exception");
      op = Integer.parseInt(br.readLine());
      switch (op) {
        case 1:
          try { int a = 30, b = 0; int c = a / b; }
          catch (ArithmeticException e) {
            System.out.println("Can't divide a number by 0"); }
        case 2:
          try { String a = "This is like chipping "; char c = a.charAt(24); }
          catch (StringIndexOutOfBoundsException e) {
            System.out.println("StringIndexOutOfBoundsException"); }
        case 3:
          try { FileReader fr = new FileReader(new File("E://file.txt")); }
          catch (FileNotFoundException e) {
            System.out.println("File does not exist"); }
        case 4:
          try { int num = Integer.parseInt("akki"); }
          catch (NumberFormatException e) {
            System.out.println("Number format exception"); }
        case 5:
          try { int a[] = new int[5]; a[6] = 9; }
          catch (ArrayIndexOutOfBoundsException e) {
            System.out.println("Array Index is Out Of Bounds"); }
      }
    } while (op <= 5);
  }
}`]],out:"Enter your option\n1.Arithmetic Exception\n2.StringIndexOutOfBound Exception\n3.FileNotFound Exception\n4.NumberFormat Exception\n5.ArrayIndexOutOfBounds Exception\n1\nCan't divide a number by 0\nStringIndexOutOfBoundsException\nFile does not exist\nNumber format exception\nArray Index is Out Of Bounds"},

{id:"palette",t:"Color palette",aim:"An applet where buttons recolor the foreground or background of a text area, with a choice of two campus images.",
files:[["ColorPalette.java",`import java.awt.*;
import java.awt.event.*;
import java.applet.*;
/*
<applet code="ColorPalette" width=500 height=500>
<param name="recmb" value="recmb.jpg">
<param name="recwsb" value="recwsb.jpg">
</applet>
*/
public class ColorPalette extends Applet
    implements ActionListener, ItemListener {
  Button btnRed, btnGreen, btnBlue;
  String str = "";
  CheckboxGroup cbgColor, cbgImage;
  Checkbox optFore, optBack, optMb, optWsb;
  Image imgMb, imgWsb;
  TextArea txtaComments = new TextArea("", 5, 30);

  public void init() {
    setLayout(new GridLayout(4, 3));
    cbgColor = new CheckboxGroup();
    cbgImage = new CheckboxGroup();
    optFore = new Checkbox("Foreground", cbgColor, true);
    optBack = new Checkbox("Background", cbgColor, false);
    optMb = new Checkbox("REC-Main Block", cbgImage, true);
    optWsb = new Checkbox("REC-Workshop Block", cbgImage, false);
    btnRed = new Button("Red");
    btnGreen = new Button("Green");
    btnBlue = new Button("Blue");
    imgMb = getImage(getDocumentBase(), getParameter("recmb"));
    imgWsb = getImage(getDocumentBase(), getParameter("recwsb"));
    add(btnRed); add(btnGreen); add(btnBlue);
    add(new Label("Select the Area :")); add(optFore); add(optBack);
    add(new Label("Select the Image :")); add(optMb); add(optWsb);
    add(txtaComments);
    optFore.addItemListener(this); optBack.addItemListener(this);
    optMb.addItemListener(this);   optWsb.addItemListener(this);
    btnRed.addActionListener(this);
    btnGreen.addActionListener(this);
    btnBlue.addActionListener(this);
  }
  public void actionPerformed(ActionEvent ae) {
    str = cbgColor.getSelectedCheckbox().getLabel();
    Color c = ae.getSource() == btnRed ? Color.red

{id:"socket",t:"Client-server application (sockets)",aim:"A TCP client sends typed lines to a server, which prints them until the client sends \"Over\".",
note:"In the PDF this program is filed under \"Client server application using RMI\", but the code uses plain sockets. The RMI program is experiment 8.",
files:[["Client.java",`import java.net.*;
import java.io.*;

public class Client {
  private Socket socket = null;
  private DataInputStream input = null;
  private DataOutputStream out = null;

  public Client(String address, int port) {
    try {
      socket = new Socket(address, port);
      System.out.println("Connected");
      input = new DataInputStream(System.in);
      out = new DataOutputStream(socket.getOutputStream());
    } catch (UnknownHostException u) { System.out.println(u); }
      catch (IOException i) { System.out.println(i); }

    String line = "";
    while (!line.equals("Over")) {
      try {
        line = input.readLine();
        out.writeUTF(line);
      } catch (IOException i) { System.out.println(i); }
    }
    try { input.close(); out.close(); socket.close(); }
    catch (IOException i) { System.out.println(i); }
  }
  public static void main(String args[]) {
    new Client("127.0.0.1", 5000);
  }
}`],["Server.java",`import java.net.*;
import java.io.*;

public class Server {
  private Socket socket = null;
  private ServerSocket server = null;
  private DataInputStream in = null;

  public Server(int port) {
    try {
      server = new ServerSocket(port);
      System.out.println("Server started");
      System.out.println("Waiting for a client ...");
      socket = server.accept();
      System.out.println("Client accepted");
      in = new DataInputStream(
          new BufferedInputStream(socket.getInputStream()));
      String line = "";
      while (!line.equals("Over")) {
        try {
          line = in.readUTF();
          System.out.println(line);
        } catch (IOException i) { System.out.println(i); }
      }
      System.out.println("Closing connection");
      socket.close();
      in.close();
    } catch (IOException i) { System.out.println(i); }
  }
  public static void main(String args[]) {
    new Server(5000);
  }
}`]],out:"Server window:\nServer started\nWaiting for a client ...\nClient accepted\nhello\njava\n\nClient window:\nConnected\nhello\njava"},
{id:"calculator",t:"Calculator",aim:"An applet with two number fields and four buttons for add, subtract, multiply and divide.",
note:"Dividing by zero or entering non-numbers throws an exception. Wrap the parsing in try/catch to handle that.",
files:[["calculator.java",`import java.awt.*;
import java.awt.event.*;
import java.applet.*;
/* <applet code="calculator" width="700" height="200">
</applet> */
public class calculator extends Applet implements ActionListener {
  TextField t1, t2, t3;
  Button b1, b2, b3, b4;

  public void init() {
    add(new Label("First Number"));  t1 = new TextField(15); add(t1);
    add(new Label("Second Number")); t2 = new TextField(15); add(t2);
    add(new Label("Result"));        t3 = new TextField(15); add(t3);
    b1 = new Button("ADD");  add(b1); b1.addActionListener(this);
    b2 = new Button("SUB");  add(b2); b2.addActionListener(this);
    b3 = new Button("MULT"); add(b3); b3.addActionListener(this);
    b4 = new Button("DIV");  add(b4); b4.addActionListener(this);
  }
  public void actionPerformed(ActionEvent e) {
    int x = Integer.parseInt(t1.getText());
    int y = Integer.parseInt(t2.getText());
    if (e.getSource() == b1) t3.setText(" " + (x + y));
    if (e.getSource() == b2) t3.setText(" " + (x - y));
    if (e.getSource() == b3) t3.setText(" " + (x * y));
    if (e.getSource() == b4) t3.setText(" " + (x / y));
    showStatus(" text & button example");
    repaint();
  }
}`]],out:"Applet Viewer: calculator\nFirst Number [4]  Second Number [2]  Result [2]  [ADD] [SUB] [MULT] [DIV]\n(screenshot taken after pressing DIV: 4 / 2 = 2)"},
